<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>全市场扫描 - chan.py 缠论助手</title>
  <script src="{{ echarts_js_url }}"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0d14;
      --bar: #111424;
      --panel: #141827;
      --panel-soft: #182033;
      --line: #283149;
      --line-soft: #20283c;
      --text: #eef3ff;
      --muted: #8e99b2;
      --accent: #3da0ff;
      --accent-strong: #4aa8ff;
      --accent-warm: #ff8a1f;
      --danger: #ff5c70;
      --up: #ff4d4f;
      --down: #18c7b7;
      --gold: #f3c842;
      --violet: #a772ff;
      --good: #68d36f;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif;
      font-size: 14px;
      overflow: hidden;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      border: 0;
    }

    .app-shell {
      height: 100vh;
      min-height: 0;
      display: grid;
      grid-template-rows: 50px 1fr 32px;
      background: radial-gradient(circle at top left, rgba(61, 160, 255, 0.08), transparent 34%),
        linear-gradient(180deg, #0c0f19 0%, #090b12 100%);
      overflow: hidden;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 0 18px 0 22px;
      background: var(--bar);
      border-bottom: 1px solid #24304c;
    }

    .brand {
      display: inline-flex;
      align-items: baseline;
      gap: 14px;
      min-width: 0;
      white-space: nowrap;
    }

    .brand-main {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: #ff6f22;
      font-size: 17px;
      font-weight: 800;
    }

    .brand-mark {
      width: 20px;
      height: 17px;
      border-left: 2px solid #ff6f22;
      border-bottom: 2px solid #ff6f22;
      position: relative;
      flex: 0 0 auto;
    }

    .brand-mark::after {
      content: "";
      position: absolute;
      left: 3px;
      bottom: 4px;
      width: 14px;
      height: 8px;
      border-left: 3px solid #ff3f37;
      border-bottom: 3px solid #ff3f37;
      transform: skew(-22deg);
    }

    .brand-sub {
      color: var(--muted);
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .top-actions {
      display: inline-flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      color: var(--muted);
      font-size: 12px;
      min-width: 0;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--text);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--good);
      box-shadow: 0 0 10px rgba(104, 211, 111, 0.55);
    }

    .status-dot.loading {
      background: var(--gold);
      box-shadow: 0 0 10px rgba(243, 200, 66, 0.6);
    }

    .status-dot.error {
      background: var(--danger);
      box-shadow: 0 0 10px rgba(255, 92, 112, 0.6);
    }

    .nav-link {
      min-height: 30px;
      display: inline-flex;
      align-items: center;
      padding: 0 10px;
      border: 1px solid #34415f;
      border-radius: 6px;
      background: #151d31;
      color: #d9e4f7;
      text-decoration: none;
      font-weight: 800;
    }

    .workspace {
      min-height: 0;
      height: 100%;
      display: grid;
      grid-template-columns: 340px minmax(560px, 1fr) 340px;
      gap: 12px;
      padding: 12px;
      overflow: hidden;
    }

    .left-rail,
    .right-rail {
      min-height: 0;
      max-height: 100%;
      overflow: hidden;
    }

    .left-rail,
    .right-rail {
      display: grid;
      gap: 12px;
    }

    .left-rail {
      grid-template-rows: auto auto minmax(0, 1fr);
    }

    .right-rail {
      grid-template-rows: auto auto minmax(0, 1fr);
    }

    .panel,
    .chart-panel {
      background: rgba(20, 24, 39, 0.94);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.24);
    }

    .panel {
      padding: 14px 16px;
      min-width: 0;
    }

    .panel-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 0 0 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--line-soft);
      color: var(--text);
      font-size: 14px;
      font-weight: 800;
    }

    .panel-kicker {
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .stat-cell {
      min-height: 58px;
      padding: 10px;
      border: 1px solid #24304a;
      border-radius: 6px;
      background: #121a2d;
    }

    .stat-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .stat-value {
      margin-top: 7px;
      color: var(--text);
      font-size: 18px;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      word-break: break-word;
    }

    .filter-grid {
      display: grid;
      gap: 10px;
    }

    .field-label {
      display: block;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .filter-input,
    .filter-select {
      width: 100%;
      height: 36px;
      border: 1px solid #33405d;
      border-radius: 6px;
      background: #101727;
      color: var(--text);
      outline: none;
    }

    .filter-input {
      padding: 0 11px;
      font-weight: 800;
    }

    .filter-select {
      padding: 0 10px;
    }

    .filter-input:focus,
    .filter-select:focus {
      border-color: var(--accent-strong);
      box-shadow: 0 0 0 2px rgba(61, 160, 255, 0.18);
    }

    .filter-pair {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 10px;
    }

    .stock-list {
      min-height: 0;
      overflow: auto;
      padding: 0;
    }

    .stock-item {
      width: 100%;
      display: grid;
      gap: 8px;
      padding: 12px 14px;
      border-bottom: 1px solid rgba(40, 49, 73, 0.72);
      background: transparent;
      color: var(--text);
      text-align: left;
      cursor: pointer;
    }

    .stock-item:hover,
    .stock-item.active {
      background: rgba(61, 160, 255, 0.1);
    }

    .stock-main {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-width: 0;
    }

    .stock-title {
      min-width: 0;
      font-weight: 900;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .stock-code {
      color: var(--muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .stock-meta,
    .signal-meta {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
      font-variant-numeric: tabular-nums;
    }

    .signal-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .signal-tag {
      display: inline-flex;
      min-height: 22px;
      align-items: center;
      padding: 0 7px;
      border-radius: 6px;
      background: rgba(142, 153, 178, 0.12);
      color: #dce7fb;
      font-size: 12px;
      font-weight: 900;
    }

    .signal-tag.buy {
      background: rgba(255, 77, 79, 0.14);
      color: var(--up);
    }

    .signal-tag.sell {
      background: rgba(24, 199, 183, 0.14);
      color: var(--down);
    }

    .chart-panel {
      min-width: 0;
      min-height: 0;
      max-height: 100%;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      overflow: hidden;
    }

    .chart-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      min-height: 70px;
      padding: 16px 20px 13px;
      background: #11172a;
      border-bottom: 1px solid var(--line-soft);
    }

    .ticker-line {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .ticker-title {
      font-size: 17px;
      font-weight: 900;
      color: #fff;
    }

    .last-price {
      font-size: 20px;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
    }

    .price-change {
      padding: 4px 9px;
      border-radius: 6px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      background: rgba(142, 153, 178, 0.12);
      color: var(--muted);
    }

    .price-up {
      color: var(--up);
    }

    .price-down {
      color: var(--down);
    }

    .price-change.price-up {
      background: rgba(255, 77, 79, 0.14);
    }

    .price-change.price-down {
      background: rgba(24, 199, 183, 0.14);
    }

    .chart-subtitle {
      margin-top: 7px;
      color: var(--muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .chart-actions {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      flex: 0 0 auto;
    }

    .level-badge {
      padding: 5px 9px;
      border-radius: 6px;
      background: rgba(255, 138, 31, 0.14);
      color: #ffc078;
      font-size: 12px;
      font-weight: 800;
    }

    .fit-btn {
      width: 34px;
      height: 34px;
      border-radius: 6px;
      border: 1px solid #34415f;
      background: #151d31;
      color: #d9e4f7;
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
    }

    .chart-tabs {
      display: flex;
      align-items: center;
      gap: 24px;
      padding: 0 18px;
      height: 40px;
      background: #121a2e;
      border-bottom: 1px solid var(--line-soft);
    }

    .chart-tab {
      height: 40px;
      display: inline-flex;
      align-items: center;
      color: #71bdff;
      border-bottom: 2px solid var(--accent-strong);
      font-weight: 800;
    }

    .chart-body {
      position: relative;
      min-height: 0;
      background: #111321;
      overflow: hidden;
    }

    #scan-chart {
      width: 100%;
      height: 100%;
      min-height: 0;
    }

    .info-panel {
      position: absolute;
      z-index: 5;
      top: 12px;
      left: 12px;
      min-width: 420px;
      max-width: min(760px, calc(100% - 24px));
      padding: 9px 10px;
      background: rgba(14, 18, 31, 0.88);
      border: 1px solid rgba(61, 160, 255, 0.18);
      border-radius: 6px;
      color: var(--muted);
      pointer-events: none;
      backdrop-filter: blur(8px);
    }

    .info-title {
      margin-bottom: 6px;
      color: #dce7fb;
      font-weight: 800;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(68px, auto));
      gap: 5px 12px;
      font-variant-numeric: tabular-nums;
    }

    .info-grid b {
      color: var(--text);
      font-weight: 800;
    }

    .message {
      position: absolute;
      z-index: 6;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(11, 13, 20, 0.76);
      text-align: center;
      padding: 24px;
      color: #c5d2ea;
      font-size: 15px;
      line-height: 1.7;
    }

    .message.error {
      color: var(--danger);
    }

    .check-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px 14px;
    }

    .check-row {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
      font-weight: 700;
      cursor: pointer;
    }

    .check-row input {
      width: 16px;
      height: 16px;
      accent-color: var(--accent-strong);
    }

    .ma5 {
      color: #f3a62d;
    }

    .ma10 {
      color: #ff667a;
    }

    .ma20 {
      color: #32d4c9;
    }

    .ma30 {
      color: var(--gold);
    }

    .chart-legend {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-start;
      gap: 8px 11px;
      width: 100%;
      padding: 11px 12px;
      background: rgba(14, 18, 31, 0.84);
      border: 1px solid rgba(61, 160, 255, 0.16);
      border-radius: 6px;
      color: #ccd8ef;
      font-size: 12px;
      pointer-events: none;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    .legend-line {
      width: 20px;
      height: 0;
      border-top: 3px solid var(--legend-color);
    }

    .legend-line.thin {
      border-top-width: 2px;
    }

    .legend-box {
      width: 18px;
      height: 10px;
      border-radius: 2px;
      background: var(--legend-color);
      opacity: 0.2;
      border: 1px solid var(--legend-color);
    }

    .legend-candle {
      width: 16px;
      height: 12px;
      border: 2px solid var(--up);
      border-radius: 2px;
      position: relative;
      background: rgba(255, 77, 79, 0.16);
    }

    .legend-triangle {
      width: 0;
      height: 0;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-bottom: 11px solid var(--legend-color);
    }

    .legend-triangle.down {
      border-bottom: 0;
      border-top: 11px solid var(--legend-color);
    }

    .side-title {
      padding: 14px 16px;
      border-bottom: 1px solid var(--line-soft);
      font-weight: 900;
    }

    .detail-panel {
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      padding: 0;
      overflow: hidden;
    }

    .detail-body,
    .signal-list {
      min-height: 0;
      overflow: auto;
      padding: 14px 16px;
    }

    .detail-block {
      display: grid;
      gap: 10px;
      margin-bottom: 16px;
    }

    .detail-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 9px;
      border-bottom: 1px solid rgba(40, 49, 73, 0.7);
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .detail-row b {
      color: var(--text);
      font-weight: 800;
    }

    .signal-item {
      padding: 11px 6px;
      border-bottom: 1px solid rgba(40, 49, 73, 0.74);
      cursor: pointer;
    }

    .signal-item:hover,
    .signal-item.active {
      background: rgba(61, 160, 255, 0.09);
      border-radius: 6px;
    }

    .signal-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 5px;
    }

    .signal-date {
      color: var(--text);
      font-weight: 900;
      font-variant-numeric: tabular-nums;
    }

    .signal-badge {
      font-weight: 900;
      font-variant-numeric: tabular-nums;
    }

    .signal-buy {
      color: var(--up);
    }

    .signal-sell {
      color: var(--down);
    }

    .signal-empty {
      color: var(--muted);
      line-height: 1.7;
    }

    .footerbar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 0 18px;
      border-top: 1px solid #24304c;
      background: #0f1424;
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 1280px) {
      .workspace {
        grid-template-columns: 320px minmax(460px, 1fr) 300px;
      }
    }

    @media (max-width: 1080px) {
      body {
        overflow: auto;
      }

      .app-shell {
        height: auto;
        min-height: 100vh;
        grid-template-rows: 50px auto 32px;
        overflow: visible;
      }

      .workspace {
        grid-template-columns: minmax(0, 1fr);
        min-height: calc(100vh - 82px);
        height: auto;
        overflow: visible;
      }

      .left-rail,
      .right-rail {
        min-height: 360px;
      }

      .chart-panel {
        min-height: 620px;
      }
    }

    @media (max-width: 760px) {
      .topbar {
        padding: 0 12px;
      }

      .brand-sub {
        display: none;
      }

      .workspace {
        padding: 8px;
      }

      .stat-grid,
      .filter-pair {
        grid-template-columns: 1fr;
      }

      .info-panel {
        min-width: 0;
        max-width: calc(100% - 24px);
      }

      .info-grid {
        grid-template-columns: repeat(2, minmax(98px, auto));
      }

      .chart-header {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-main"><span class="brand-mark"></span>全市场扫描</div>
        <div class="brand-sub">A 股日线买卖点结果</div>
      </div>
      <div class="top-actions">
        <span class="status-pill"><i id="status-dot" class="status-dot loading"></i><span id="status-text">加载中</span></span>
        <a class="nav-link" href="/">返回单票</a>
      </div>
    </header>

    <main class="workspace">
      <aside class="left-rail">
        <section class="panel">
          <h2 class="panel-title">扫描概览 <span id="scan-time" class="panel-kicker">-</span></h2>
          <div id="overview-grid" class="stat-grid"></div>
        </section>

        <section class="panel">
          <h2 class="panel-title">筛选 <span id="filter-count" class="panel-kicker">0 只</span></h2>
          <div class="filter-grid">
            <div>
              <span class="field-label">代码 / 名称</span>
              <input id="search-input" class="filter-input" type="search" autocomplete="off" spellcheck="false">
            </div>
            <div class="filter-pair">
              <div>
                <span class="field-label">方向</span>
                <select id="direction-filter" class="filter-select">
                  <option value="all">全部</option>
                  <option value="buy">买点</option>
                  <option value="sell">卖点</option>
                </select>
              </div>
              <div>
                <span class="field-label">类型</span>
                <select id="type-filter" class="filter-select">
                  <option value="all">全部</option>
                </select>
              </div>
            </div>
          </div>
        </section>

        <section id="stock-list" class="panel stock-list"></section>
      </aside>

      <section class="chart-panel">
        <div class="chart-header">
          <div>
            <div class="ticker-line">
              <span id="chart-title" class="ticker-title">-</span>
              <span id="last-price" class="last-price">-</span>
              <span id="price-change" class="price-change">-</span>
            </div>
            <div id="chart-subtitle" class="chart-subtitle">-</div>
          </div>
          <div class="chart-actions">
            <span class="level-badge">日线</span>
            <button id="fit-btn" class="fit-btn" type="button" title="查看全部" aria-label="查看全部">↔</button>
          </div>
        </div>
        <div class="chart-tabs">
          <span class="chart-tab">K线图</span>
        </div>
        <div class="chart-body">
          <div id="info" class="info-panel"></div>
          <div id="scan-chart"></div>
          <div id="message" class="message"></div>
        </div>
      </section>

      <aside class="right-rail">
        <div class="chart-legend">
          <span class="legend-item"><i class="legend-candle"></i>K线</span>
          <span class="legend-item"><i class="legend-line thin" style="--legend-color:#f3a62d"></i>MA5</span>
          <span class="legend-item"><i class="legend-line thin" style="--legend-color:#ff667a"></i>MA10</span>
          <span class="legend-item"><i class="legend-line thin" style="--legend-color:#32d4c9"></i>MA20</span>
          <span class="legend-item"><i class="legend-line thin" style="--legend-color:#f3c842"></i>MA30</span>
          <span class="legend-item"><i class="legend-line" style="--legend-color:#dce7fb"></i>笔</span>
          <span class="legend-item"><i class="legend-line" style="--legend-color:#ff6f9c"></i>线段</span>
          <span class="legend-item"><i class="legend-box" style="--legend-color:#3da0ff"></i>中枢</span>
          <span class="legend-item"><i class="legend-box" style="--legend-color:#a772ff"></i>段中枢</span>
          <span class="legend-item"><i class="legend-triangle" style="--legend-color:#ff4d4f"></i>买点</span>
          <span class="legend-item"><i class="legend-triangle down" style="--legend-color:#18c7b7"></i>卖点</span>
        </div>

        <section class="panel">
          <h2 class="panel-title">图层</h2>
          <div class="check-grid">
            <label class="check-row"><input type="checkbox" data-series-names="笔" checked>笔</label>
            <label class="check-row"><input type="checkbox" data-series-names="线段" checked>线段</label>
            <label class="check-row"><input type="checkbox" data-series-names="中枢" checked>中枢</label>
            <label class="check-row"><input type="checkbox" data-series-names="线段中枢" checked>段中枢</label>
            <label class="check-row"><input type="checkbox" data-series-names="买点,卖点,线段买点,线段卖点" checked>买卖点</label>
            <label class="check-row ma5"><input type="checkbox" data-series-names="MA5" checked>MA5</label>
            <label class="check-row ma10"><input type="checkbox" data-series-names="MA10" checked>MA10</label>
            <label class="check-row ma20"><input type="checkbox" data-series-names="MA20" checked>MA20</label>
            <label class="check-row ma30"><input type="checkbox" data-series-names="MA30" checked>MA30</label>
          </div>
        </section>

        <section class="panel detail-panel">
          <div class="side-title">命中详情</div>
          <div class="detail-body">
            <div id="stock-detail" class="detail-block"></div>
            <div id="signal-list" class="signal-list"></div>
          </div>
        </section>
      </aside>
    </main>

    <footer class="footerbar">
      <span id="footer-text">就绪</span>
    </footer>
  </div>

  <script>
    const statusDot = document.getElementById("status-dot");
    const statusText = document.getElementById("status-text");
    const footerText = document.getElementById("footer-text");
    const scanTime = document.getElementById("scan-time");
    const overviewGrid = document.getElementById("overview-grid");
    const stockList = document.getElementById("stock-list");
    const searchInput = document.getElementById("search-input");
    const directionFilter = document.getElementById("direction-filter");
    const typeFilter = document.getElementById("type-filter");
    const filterCount = document.getElementById("filter-count");
    const chartEl = document.getElementById("scan-chart");
    const message = document.getElementById("message");
    const info = document.getElementById("info");
    const chartTitle = document.getElementById("chart-title");
    const chartSubtitle = document.getElementById("chart-subtitle");
    const lastPriceEl = document.getElementById("last-price");
    const priceChangeEl = document.getElementById("price-change");
    const fitBtn = document.getElementById("fit-btn");
    const stockDetail = document.getElementById("stock-detail");
    const signalList = document.getElementById("signal-list");
    const seriesToggles = document.querySelectorAll("[data-series-names]");

    let latestScan = null;
    let stocks = [];
    let filteredStocks = [];
    let selectedCode = null;
    let chart = null;
    let activePayload = null;
    let activeCandles = [];
    let activeMa = {};
    let activeSignals = [];

    function fmt(value, digits = 2) {
      if (value === null || value === undefined || Number.isNaN(Number(value))) {
        return "-";
      }
      return Number(value).toFixed(digits);
    }

    function fmtSigned(value, digits = 2) {
      if (value === null || value === undefined || Number.isNaN(Number(value))) {
        return "-";
      }
      const num = Number(value);
      const prefix = num > 0 ? "+" : "";
      return `${prefix}${num.toFixed(digits)}`;
    }

    function fmtVolume(value) {
      if (value === null || value === undefined || Number.isNaN(Number(value))) {
        return "-";
      }
      const num = Number(value);
      if (Math.abs(num) >= 100000000) {
        return `${(num / 100000000).toFixed(2)}亿`;
      }
      if (Math.abs(num) >= 10000) {
        return `${(num / 10000).toFixed(2)}万`;
      }
      return num.toFixed(0);
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;"
      }[char]));
    }

    function setStatus(kind, text) {
      statusDot.className = `status-dot ${kind === "ready" ? "" : kind}`.trim();
      statusText.textContent = text;
      footerText.textContent = text;
    }

    function showMessage(text, isError = false) {
      message.textContent = text;
      message.classList.toggle("error", isError);
      message.style.display = text ? "flex" : "none";
    }

    function ensureChart() {
      if (!chart) {
        chart = echarts.init(chartEl, null, {renderer: "canvas"});
      }
      return chart;
    }

    function getSelectedSeries() {
      const selected = {};
      seriesToggles.forEach(toggle => {
        const names = toggle.dataset.seriesNames.split(",").map(name => name.trim()).filter(Boolean);
        names.forEach(name => {
          selected[name] = toggle.checked;
        });
      });
      return selected;
    }

    function applySeriesSelection() {
      if (!chart) {
        return;
      }
      chart.setOption({legend: {show: false, selected: getSelectedSeries()}});
    }

    function renderOverview(payload) {
      scanTime.textContent = payload.scan_time || "-";
      const items = [
        ["扫描股票", payload.total_scanned],
        ["命中股票", payload.matched_count],
        ["错误股票", payload.error_count],
        ["判断窗口", `最近 ${payload.recent_k_count || 7} 根`],
        ["数据范围", `${payload.start_date || "-"} / ${payload.end_date || "-"}`],
        ["周期", payload.level === "daily" ? "日线" : payload.level || "-"]
      ];
      overviewGrid.innerHTML = items.map(([label, value]) => `
        <div class="stat-cell">
          <div class="stat-label">${escapeHtml(label)}</div>
          <div class="stat-value">${escapeHtml(value ?? "-")}</div>
        </div>
      `).join("");
    }

    function populateTypeFilter() {
      const types = new Set();
      stocks.forEach(stock => {
        (stock.signals || []).forEach(signal => {
          if (signal.display_type) {
            types.add(signal.display_type);
          }
        });
      });
      typeFilter.innerHTML = `<option value="all">全部</option>` + [...types].sort().map(type => (
        `<option value="${escapeHtml(type)}">${escapeHtml(type)}</option>`
      )).join("");
    }

    function stockMatchesFilters(stock) {
      const query = searchInput.value.trim().toLowerCase();
      const direction = directionFilter.value;
      const type = typeFilter.value;
      const text = `${stock.code || ""} ${stock.name || ""} ${stock.full_code || ""}`.toLowerCase();
      if (query && !text.includes(query)) {
        return false;
      }
      const signals = stock.signals || [];
      if (direction !== "all" && !signals.some(signal => signal.direction === direction)) {
        return false;
      }
      if (type !== "all" && !signals.some(signal => signal.display_type === type)) {
        return false;
      }
      return true;
    }

    function renderStockList() {
      filteredStocks = stocks.filter(stockMatchesFilters);
      filterCount.textContent = `${filteredStocks.length} 只`;
      if (!filteredStocks.length) {
        stockList.innerHTML = `<div class="signal-empty" style="padding:14px 16px;">暂无匹配结果。</div>`;
        return;
      }
      stockList.innerHTML = filteredStocks.map(stock => {
        const tags = (stock.signals || []).slice(0, 4).map(signal => `
          <span class="signal-tag ${signal.direction === "buy" ? "buy" : "sell"}">${escapeHtml(signal.display_type || signal.label || signal.type)}</span>
        `).join("");
        return `
          <button class="stock-item ${stock.code === selectedCode ? "active" : ""}" type="button" data-code="${escapeHtml(stock.code)}">
            <span class="stock-main">
              <span class="stock-title">${escapeHtml(stock.name)} <span class="stock-code">${escapeHtml(stock.code)}</span></span>
              <span class="stock-code">${escapeHtml(stock.market || "")}</span>
            </span>
            <span class="stock-meta">${escapeHtml(stock.latest_date || "-")} · 收盘 ${fmt(stock.latest_close)} · ${stock.signal_count || (stock.signals || []).length} 个信号</span>
            <span class="signal-tags">${tags}</span>
          </button>
        `;
      }).join("");
      stockList.querySelectorAll(".stock-item").forEach(button => {
        button.addEventListener("click", () => selectStock(button.dataset.code));
      });
    }

    function updateInfo(idx) {
      const candle = activeCandles[idx] || activeCandles[activeCandles.length - 1];
      if (!candle) {
        info.innerHTML = "";
        return;
      }
      const i = candle.idx;
      const priceClass = candle.close >= candle.open ? "price-up" : "price-down";
      info.innerHTML = `
        <div class="info-title">${escapeHtml(candle.time)}</div>
        <div class="info-grid">
          <span>开 <b>${fmt(candle.open)}</b></span>
          <span class="price-up">高 <b>${fmt(candle.high)}</b></span>
          <span class="price-down">低 <b>${fmt(candle.low)}</b></span>
          <span class="${priceClass}">收 <b>${fmt(candle.close)}</b></span>
          <span>量 <b>${fmtVolume(candle.volume)}</b></span>
          <span class="ma5">MA5 <b>${fmt(activeMa.ma5?.[i])}</b></span>
          <span class="ma10">MA10 <b>${fmt(activeMa.ma10?.[i])}</b></span>
          <span class="ma20">MA20 <b>${fmt(activeMa.ma20?.[i])}</b></span>
          <span class="ma30">MA30 <b>${fmt(activeMa.ma30?.[i])}</b></span>
        </div>
      `;
      document.querySelectorAll(".signal-item").forEach(item => {
        item.classList.toggle("active", Number(item.dataset.idx) === i);
      });
    }

    function collectSignals(elements) {
      return [
        ...(elements.bsp || []),
        ...(elements.seg_bsp || [])
      ].map(item => {
        const candle = activeCandles[item.x] || {};
        return {
          ...item,
          time: candle.time || "-",
          close: candle.close,
          kind: item.is_seg ? "线段买卖点" : "买卖点"
        };
      }).sort((a, b) => b.x - a.x);
    }

    function focusSignal(idx) {
      updateInfo(idx);
      ensureChart().dispatchAction({
        type: "dataZoom",
        startValue: Math.max(0, idx - 40),
        endValue: Math.min(activeCandles.length - 1, idx + 40)
      });
    }

    function renderSignalList() {
      if (!activeSignals.length) {
        signalList.innerHTML = `<div class="signal-empty">当前范围内暂无买卖点。</div>`;
        return;
      }
      signalList.innerHTML = activeSignals.map(item => `
        <div class="signal-item" data-idx="${item.x}">
          <div class="signal-row">
            <span class="signal-date">${escapeHtml(item.time)}</span>
            <span class="signal-badge ${item.is_buy ? "signal-buy" : "signal-sell"}">${escapeHtml(item.label)}</span>
          </div>
          <div class="signal-meta">${escapeHtml(item.kind)} · K线序号 ${item.x}</div>
          <div class="signal-meta">价格 ${fmt(item.y)} · 收盘 ${fmt(item.close)}</div>
        </div>
      `).join("");
      signalList.querySelectorAll(".signal-item").forEach(item => {
        item.addEventListener("click", () => focusSignal(Number(item.dataset.idx)));
      });
    }

    function renderStockDetail(payload) {
      const scanSignals = payload.scan_signals || [];
      const buyCount = scanSignals.filter(signal => signal.direction === "buy").length;
      const sellCount = scanSignals.length - buyCount;
      stockDetail.innerHTML = `
        <div class="detail-row"><span>股票</span><b>${escapeHtml(payload.stock_name || payload.display_code || "-")}</b></div>
        <div class="detail-row"><span>代码</span><b>${escapeHtml(payload.display_code || payload.code || "-")}</b></div>
        <div class="detail-row"><span>市场</span><b>${escapeHtml(payload.market || payload.stock?.market_label || "-")}</b></div>
        <div class="detail-row"><span>命中信号</span><b>${buyCount} 买 / ${sellCount} 卖</b></div>
      `;
    }

    function renderSummary(payload) {
      const candles = payload.candles || [];
      const latest = candles[candles.length - 1];
      const previous = candles[candles.length - 2];
      const change = latest && previous ? latest.close - previous.close : null;
      const percent = latest && previous && previous.close ? (change / previous.close) * 100 : null;
      const priceClass = change === null ? "" : change >= 0 ? "price-up" : "price-down";

      chartTitle.textContent = `${payload.stock_name || payload.display_code || payload.code} ${payload.display_code || ""}`.trim();
      chartSubtitle.textContent = `${payload.start} 至 ${payload.end} · ${candles.length} 根K线`;
      lastPriceEl.textContent = latest ? fmt(latest.close) : "-";
      lastPriceEl.className = `last-price ${priceClass}`.trim();
      priceChangeEl.textContent = change === null ? "-" : `${fmtSigned(change)} (${fmtSigned(percent)}%)`;
      priceChangeEl.className = `price-change ${priceClass}`.trim();
      renderStockDetail(payload);
    }

    function applyRuntimeFormatters(option, payload) {
      const tickLabels = new Map((payload.date_ticks || []).map(item => [String(item.value), item.label]));
      option.backgroundColor = "#111321";
      option.animation = false;
      option.title = {show: false};
      option.legend = {show: false, selected: getSelectedSeries()};
      option.grid = {
        left: 54,
        right: 18,
        top: 20,
        bottom: 30,
        containLabel: true
      };

      const xAxes = Array.isArray(option.xAxis) ? option.xAxis : [option.xAxis];
      xAxes.forEach(xAxis => {
        xAxis.axisLabel = {
          ...(xAxis.axisLabel || {}),
          color: "#737f99",
          fontSize: 11,
          interval: (_index, value) => tickLabels.has(String(value)),
          formatter: value => tickLabels.get(String(value)) || ""
        };
        xAxis.axisLine = {lineStyle: {color: "#4b5672"}};
        xAxis.axisTick = {show: false};
        xAxis.splitLine = {show: false};
        xAxis.axisPointer = {
          show: true,
          type: "line",
          snap: true,
          lineStyle: {color: "#65708a", width: 1, type: "dashed"},
          label: {show: false}
        };
      });

      const yAxes = Array.isArray(option.yAxis) ? option.yAxis : [option.yAxis];
      yAxes.forEach(yAxis => {
        yAxis.axisLabel = {...(yAxis.axisLabel || {}), color: "#737f99"};
        yAxis.axisLine = {lineStyle: {color: "#4b5672"}};
        yAxis.splitLine = {show: false};
        yAxis.axisPointer = {
          show: true,
          type: "line",
          lineStyle: {color: "#65708a", width: 1, type: "dashed"},
          label: {show: true, precision: 2, backgroundColor: "#2a344d", color: "#dce7fb"}
        };
      });

      option.tooltip = {
        ...(option.tooltip || {}),
        trigger: "axis",
        showContent: false,
        axisPointer: {
          type: "cross",
          snap: true,
          lineStyle: {color: "#65708a", width: 1, type: "dashed"},
          crossStyle: {color: "#65708a", width: 1, type: "dashed"},
          label: {show: false}
        }
      };

      (option.dataZoom || []).forEach(zoom => {
        zoom.show = false;
        zoom.bottom = 0;
        zoom.height = 0;
      });

      (option.series || []).forEach(series => {
        if (series.type === "candlestick") {
          series.itemStyle = {
            ...(series.itemStyle || {}),
            color: "#ff4d4f",
            color0: "#18c7b7",
            borderColor: "#ff4d4f",
            borderColor0: "#18c7b7"
          };
        }
        if (series.name === "MA5") {
          series.lineStyle = {...(series.lineStyle || {}), color: "#f3a62d"};
          series.itemStyle = {...(series.itemStyle || {}), color: "#f3a62d"};
        }
        if (series.name === "MA10") {
          series.lineStyle = {...(series.lineStyle || {}), color: "#ff667a"};
          series.itemStyle = {...(series.itemStyle || {}), color: "#ff667a"};
        }
        if (series.name === "MA20") {
          series.lineStyle = {...(series.lineStyle || {}), color: "#32d4c9"};
          series.itemStyle = {...(series.itemStyle || {}), color: "#32d4c9"};
        }
        if (series.name === "MA30") {
          series.lineStyle = {...(series.lineStyle || {}), color: "#f3c842"};
          series.itemStyle = {...(series.itemStyle || {}), color: "#f3c842"};
        }
        if (series.name === "笔") {
          series.lineStyle = {...(series.lineStyle || {}), color: "#dce7fb", width: 1.6};
        }
        if (series.name === "线段") {
          series.lineStyle = {...(series.lineStyle || {}), color: "#ff6f9c", width: 2.7};
        }
        if (series.markArea && series.name === "中枢") {
          series.markArea.itemStyle = {color: "rgba(61, 160, 255, 0.16)"};
        }
        if (series.markArea && series.name === "线段中枢") {
          series.markArea.itemStyle = {color: "rgba(167, 114, 255, 0.14)"};
        }
        if (series.label) {
          series.label.color = "#dce7fb";
        }
      });

      return option;
    }

    function bindChartEvents() {
      const instance = ensureChart();
      instance.off("updateAxisPointer");
      instance.on("updateAxisPointer", params => {
        const xAxisInfo = (params.axesInfo || []).find(item => item.axisDim === "x");
        if (!xAxisInfo) {
          return;
        }
        const idx = Number(xAxisInfo.value);
        if (Number.isInteger(idx) && idx >= 0 && idx < activeCandles.length) {
          updateInfo(idx);
        }
      });
    }

    function renderChart(payload) {
      activePayload = payload;
      activeCandles = payload.candles || [];
      activeMa = payload.ma || {};
      activeSignals = collectSignals(payload.elements || {});
      renderSignalList();
      renderSummary(payload);

      const option = applyRuntimeFormatters(JSON.parse(JSON.stringify(payload.chart_options)), payload);
      const instance = ensureChart();
      instance.clear();
      instance.setOption(option, true);
      bindChartEvents();
      updateInfo(activeCandles.length - 1);
      requestAnimationFrame(() => instance.resize());
    }

    async function selectStock(code) {
      if (!code) {
        return;
      }
      selectedCode = code;
      renderStockList();
      showMessage("正在读取扫描明细...");
      setStatus("loading", "读取明细");
      try {
        const response = await fetch(`/api/scan/stock/${encodeURIComponent(code)}`);
        const payload = await response.json();
        if (!response.ok || !payload.success) {
          throw new Error(payload.error || "读取股票明细失败");
        }
        showMessage("");
        renderChart(payload);
        setStatus("ready", "数据就绪");
      } catch (error) {
        showMessage(error.message, true);
        setStatus("error", "加载失败");
      }
    }

    async function loadLatestScan() {
      showMessage("正在读取最近一次扫描结果...");
      setStatus("loading", "加载扫描结果");
      try {
        const response = await fetch("/api/scan/latest");
        const payload = await response.json();
        if (!response.ok || !payload.success) {
          throw new Error(payload.error || "读取扫描结果失败");
        }
        if (!payload.exists) {
          latestScan = null;
          stocks = [];
          renderOverview({
            scan_time: "-",
            total_scanned: 0,
            matched_count: 0,
            error_count: 0,
            recent_k_count: 7,
            start_date: "-",
            end_date: "-",
            level: "daily"
          });
          renderStockList();
          showMessage(payload.message || "暂无扫描结果，请先运行全市场扫描脚本。");
          setStatus("ready", "暂无扫描结果");
          return;
        }
        latestScan = payload;
        stocks = payload.stocks || [];
        renderOverview(payload);
        populateTypeFilter();
        renderStockList();
        if (!stocks.length) {
          showMessage("最近一次扫描没有命中买卖点股票。");
          setStatus("ready", "无命中股票");
          return;
        }
        await selectStock(stocks[0].code);
      } catch (error) {
        renderStockList();
        showMessage(error.message, true);
        setStatus("error", "加载失败");
      }
    }

    [searchInput, directionFilter, typeFilter].forEach(control => {
      control.addEventListener("input", () => {
        renderStockList();
        if (filteredStocks.length && !filteredStocks.some(stock => stock.code === selectedCode)) {
          selectStock(filteredStocks[0].code);
        }
      });
    });

    seriesToggles.forEach(toggle => {
      toggle.addEventListener("change", applySeriesSelection);
    });

    fitBtn.addEventListener("click", () => {
      if (!activeCandles.length) {
        return;
      }
      ensureChart().dispatchAction({
        type: "dataZoom",
        startValue: 0,
        endValue: activeCandles.length - 1
      });
      updateInfo(activeCandles.length - 1);
    });

    window.addEventListener("resize", () => {
      if (chart) {
        chart.resize();
      }
    });

    loadLatestScan();
  </script>
</body>
</html>
